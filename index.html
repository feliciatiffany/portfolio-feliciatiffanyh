    <!-- apply the visitor's saved light/dark choice before anything draws, so there's no flash -->
    <script>
      // light by day (7:00–19:00 local time), dark in the evening and at night;
      // a choice made with the toggle holds for this visit (keep in sync with src/lib/theme.js)
      var h = new Date().getHours(), t = h >= 7 && h < 19 ? "light" : "dark";
      try { var s = sessionStorage.getItem("theme"); if (s === "dark" || s === "light") t = s; } catch (e) {}
      document.documentElement.dataset.theme = t;
    </script>
